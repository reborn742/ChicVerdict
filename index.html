
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChicVerdict AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        @keyframes logo-float {
            0% { transform: translateY(0px) scale(0.95); opacity: 0; filter: blur(10px); }
            100% { transform: translateY(-10px) scale(1); opacity: 1; filter: blur(0px); }
        }

        @keyframes text-reveal {
            0% { letter-spacing: 0.5em; opacity: 0; filter: blur(5px); }
            100% { letter-spacing: 0.05em; opacity: 1; filter: blur(0px); }
        }

        @keyframes line-expand {
            0% { width: 0; opacity: 0; }
            100% { width: 40px; opacity: 1; }
        }

        .animate-logo-reveal {
            animation: logo-float 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .animate-text-reveal {
            animation: text-reveal 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.4s;
            opacity: 0;
        }

        .animate-line-reveal {
            animation: line-expand 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 1s;
            opacity: 0;
        }
    </style>
<script type="importmap">
{

  }
}
</script>
